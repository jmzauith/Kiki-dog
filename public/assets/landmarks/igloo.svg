<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 130" width="150" height="130">
  <!-- ground -->
  <ellipse cx="75" cy="118" rx="62" ry="11" fill="#ffffff" opacity="0.95"/>
  <!-- dome of ice blocks -->
  <path d="M25,118 C25,70 48,40 75,40 C102,40 125,70 125,118 Z" fill="#eef7ff" stroke="#9fc6e8" stroke-width="3"/>
  <!-- block seams -->
  <g stroke="#bcd9f5" stroke-width="2" fill="none" opacity="0.9">
    <path d="M38,96 C60,90 90,90 112,96"/>
    <path d="M48,72 C64,66 86,66 102,72"/>
    <path d="M62,54 C70,51 80,51 88,54"/>
    <path d="M60,52 L58,72 M75,50 L75,70 M90,52 L92,72 M48,72 L46,94 M75,68 L75,92 M102,72 L104,94"/>
  </g>
  <!-- entrance tunnel -->
  <path d="M60,118 C60,98 66,88 75,88 C84,88 90,98 90,118 Z" fill="#274b66" stroke="#9fc6e8" stroke-width="2.5"/>
  <path d="M66,118 C66,104 69,96 75,96 C81,96 84,104 84,118 Z" fill="#16293c" opacity="0.9"/>
  <!-- snow cap -->
  <path d="M40,62 C52,44 66,36 78,36 C70,46 62,56 58,66 Z" fill="#ffffff" opacity="0.9"/>
  <!-- tiny pine beside -->
  <g>
    <rect x="128" y="96" width="7" height="20" fill="#6b4a2e"/>
    <polygon points="131,58 118,100 144,100" fill="#2f775e" stroke="#1f4d3d" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="131,70 122,94 140,94" fill="#ffffff" opacity="0.75"/>
  </g>
  <!-- curious sparkles -->
  <path d="M30,44 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 Z" fill="#fff3b0" opacity="0.95"/>
  <circle cx="122" cy="34" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="112" cy="46" r="2" fill="#fff3b0" opacity="0.9"/>
</svg>
