<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bdw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5713f"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
    <linearGradient id="bdwd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5f36"/>
      <stop offset="1" stop-color="#5f3d22"/>
    </linearGradient>
  </defs>
  <!-- ravine edges -->
  <polygon points="0,200 0,120 60,140 40,200" fill="#7d94ad"/>
  <polygon points="400,200 400,120 340,140 360,200" fill="#7d94ad"/>
  <polygon points="0,120 60,140 40,160 0,150" fill="#eef4fb"/>
  <polygon points="400,120 340,140 360,160 400,150" fill="#eef4fb"/>
  <!-- posts -->
  <rect x="52" y="60" width="18" height="100" rx="7" fill="url(#bdwd)" transform="rotate(6 52 60)"/>
  <rect x="330" y="60" width="18" height="100" rx="7" fill="url(#bdwd)" transform="rotate(-4 330 60)"/>
  <!-- rails: one broken, one sagging -->
  <path d="M50,84 Q150,70 210,86" stroke="url(#bdw)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M210,86 L236,108" stroke="url(#bdw)" stroke-width="10" stroke-linecap="round"/>
  <path d="M258,120 Q310,132 348,88" stroke="url(#bdw)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- deck: missing middle planks -->
  <g fill="url(#bdw)">
    <rect x="60" y="120" width="44" height="16" rx="4" transform="rotate(-2 60 120)"/>
    <rect x="108" y="122" width="44" height="16" rx="4" transform="rotate(3 108 122)"/>
    <rect x="248" y="126" width="44" height="16" rx="4" transform="rotate(-3 248 126)"/>
    <rect x="296" y="122" width="44" height="16" rx="4" transform="rotate(2 296 122)"/>
  </g>
  <!-- dangling broken plank -->
  <g transform="rotate(38 205 130)">
    <rect x="196" y="124" width="44" height="15" rx="4" fill="url(#bdwd)"/>
  </g>
  <!-- jagged break ends -->
  <polygon points="152,122 168,118 162,138 152,136" fill="#4e3319"/>
  <polygon points="248,126 262,130 254,142 244,138" fill="#4e3319"/>
  <!-- gap shadow -->
  <ellipse cx="205" cy="170" rx="55" ry="14" fill="#3d4c60" opacity="0.5"/>
  <!-- warning rope -->
  <path d="M120,60 Q205,40 290,60" stroke="#e2574c" stroke-width="5" fill="none" stroke-dasharray="12 8"/>
  <circle cx="120" cy="60" r="6" fill="#e2574c"/>
  <circle cx="290" cy="60" r="6" fill="#e2574c"/>
</svg>
