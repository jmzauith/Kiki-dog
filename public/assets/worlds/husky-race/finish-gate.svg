  </defs>
  <ellipse cx="210" cy="244" rx="180" ry="14" fill="#a9c8e6" opacity="0.55"/>
  <!-- checkered posts -->
  <g>
    <rect x="36" y="60" width="26" height="180" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <rect x="36" y="60" width="13" height="22" fill="#222"/><rect x="49" y="82" width="13" height="22" fill="#222"/>
    <rect x="36" y="104" width="13" height="22" fill="#222"/><rect x="49" y="126" width="13" height="22" fill="#222"/>
    <rect x="36" y="148" width="13" height="22" fill="#222"/><rect x="49" y="170" width="13" height="22" fill="#222"/>
    <rect x="36" y="192" width="13" height="22" fill="#222"/><rect x="49" y="214" width="13" height="22" fill="#222"/>
  </g>
  <g>
    <rect x="358" y="60" width="26" height="180" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <rect x="371" y="60" width="13" height="22" fill="#222"/><rect x="358" y="82" width="13" height="22" fill="#222"/>
    <rect x="371" y="104" width="13" height="22" fill="#222"/><rect x="358" y="126" width="13" height="22" fill="#222"/>
