<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160">
  <!-- checkered blanket -->
  <g>
    <rect x="20" y="40" width="240" height="100" rx="10" fill="#ffffff"/>
    <g fill="#e2574c" opacity="0.85">
      <rect x="20" y="40" width="40" height="33"/><rect x="100" y="40" width="40" height="33"/><rect x="180" y="40" width="40" height="33"/>
      <rect x="60" y="73" width="40" height="34"/><rect x="140" y="73" width="40" height="34"/><rect x="220" y="73" width="40" height="34"/>
      <rect x="20" y="107" width="40" height="33"/><rect x="100" y="107" width="40" height="33"/><rect x="180" y="107" width="40" height="33"/>
    </g>
    <rect x="20" y="40" width="240" height="100" rx="10" fill="none" stroke="#b03a30" stroke-width="4"/>
  </g>
  <!-- plates + food -->
  <ellipse cx="90" cy="90" rx="26" ry="10" fill="#ffffff" stroke="#d8d0c0" stroke-width="3"/>
  <circle cx="90" cy="88" r="9" fill="#e8823a"/>
  <ellipse cx="190" cy="95" rx="26" ry="10" fill="#ffffff" stroke="#d8d0c0" stroke-width="3"/>
  <ellipse cx="190" cy="92" rx="10" ry="6" fill="#8abd4a"/>
  <!-- lemonade -->
  <rect x="140" y="60" width="18" height="30" rx="5" fill="#ffd24d" opacity="0.9"/>
  <rect x="140" y="60" width="18" height="8" rx="4" fill="#fff3c4"/>
  <!-- ants? no — butterfly -->
  <g transform="translate(230 30)">
    <ellipse cx="-6" cy="0" rx="8" ry="5" fill="#f2a0b5" transform="rotate(-20)"/>
    <ellipse cx="6" cy="0" rx="8" ry="5" fill="#f2a0b5" transform="rotate(20)"/>
    <rect x="-2" y="-6" width="4" height="12" rx="2" fill="#5f3d22"/>
  </g>
</svg>
