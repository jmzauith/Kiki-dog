<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <defs>
    <linearGradient id="bbw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9713d"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="138" rx="104" ry="10" fill="#9db8d6" opacity="0.5"/>
  <!-- ravine -->
  <polygon points="60,150 84,78 156,78 180,150" fill="#3d5a78"/>
  <polygon points="84,78 156,78 148,96 92,96" fill="#2c4258"/>
  <!-- posts -->
  <rect x="52" y="34" width="14" height="100" rx="6" fill="url(#bbw)"/>
  <rect x="174" y="34" width="14" height="100" rx="6" fill="url(#bbw)"/>
  <rect x="48" y="28" width="22" height="12" rx="5" fill="#ffffff"/>
  <rect x="170" y="28" width="22" height="12" rx="5" fill="#ffffff"/>
  <!-- ropes sagging into the gap -->
  <path d="M59,52 Q120,86 181,52" stroke="#c9a06a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- broken planks: left stub -->
  <rect x="58" y="66" width="46" height="14" rx="4" fill="url(#bbw)" transform="rotate(-8 58 66)"/>
  <rect x="66" y="86" width="34" height="13" rx="4" fill="url(#bbw)" transform="rotate(-24 66 86)"/>
  <!-- broken planks: right stub -->
  <rect x="136" y="66" width="46" height="14" rx="4" fill="url(#bbw)" transform="rotate(8 182 66)"/>
  <rect x="140" y="86" width="34" height="13" rx="4" fill="url(#bbw)" transform="rotate(24 174 86)"/>
  <!-- snapped plank falling -->
  <rect x="112" y="104" width="30" height="12" rx="4" fill="url(#bbw)" transform="rotate(38 112 104)"/>
  <line x1="70" y1="60" x2="62" y2="104" stroke="#8a5a30" stroke-width="4"/>
  <line x1="170" y1="60" x2="178" y2="104" stroke="#8a5a30" stroke-width="4"/>
  <polygon points="58,52 70,44 66,56" fill="#e8b23a"/>
  <circle cx="120" cy="40" r="4" fill="#ffffff" opacity="0.85"/>
</svg>
