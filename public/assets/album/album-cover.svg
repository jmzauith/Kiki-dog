<linearGradient id="coverBg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1c2733"/><stop offset="1" stop-color="#2e3a4d"/>
</linearGradient>
<radialGradient id="coverGlow" cx="0.5" cy="0.42" r="0.55">
