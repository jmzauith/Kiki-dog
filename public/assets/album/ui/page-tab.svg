<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">

<defs>
<filter id="stickerCut" x="-20%" y="-20%" width="140%" height="140%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="11" result="d"/>
  <feFlood flood-color="#ffffff" result="w"/>
  <feComposite in="w" in2="d" operator="in" result="cut"/>
  <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1c2733" flood-opacity="0.28" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="cut"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="goldCut" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="22" result="d"/>
  <feFlood flood-color="#b98a1e" result="g"/>
  <feComposite in="g" in2="d" operator="in"/>
</filter>
<filter id="silhouette" x="-10%" y="-10%" width="120%" height="120%">
  <feColorMatrix in="SourceGraphic" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.11  0 0 0 0 0.16  0 0 0 1 0"/>
</filter>
<linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#fff3c4"/><stop offset="0.35" stop-color="#f7d774"/>
  <stop offset="0.6" stop-color="#d9a92f"/><stop offset="0.8" stop-color="#f9e28a"/>
  <stop offset="1" stop-color="#c08f1f"/>
</linearGradient>
<radialGradient id="haloGold" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
  <stop offset="0.6" stop-color="#ffd964" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#ffd964" stop-opacity="0"/>
</radialGradient>
<linearGradient id="navyCard" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2b3a52"/><stop offset="1" stop-color="#141c2a"/>
</linearGradient>
<linearGradient id="creamCard" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f3ead6"/>
</linearGradient>
<linearGradient id="violetCard" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a3563"/><stop offset="1" stop-color="#241b38"/>
</linearGradient>
</defs>
