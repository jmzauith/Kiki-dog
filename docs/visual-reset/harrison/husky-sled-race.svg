<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea9e6"/>
      <stop offset="0.6" stop-color="#a5d4f5"/>
      <stop offset="1" stop-color="#d8ecfb"/>
    </linearGradient>
    <linearGradient id="rmtfar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cdea"/>
      <stop offset="1" stop-color="#a2badf"/>
    </linearGradient>
    <linearGradient id="rmtmid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9d4"/>
      <stop offset="1" stop-color="#7c9cc8"/>
    </linearGradient>
    <linearGradient id="rtrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5e8fa"/>
    </linearGradient>
    <linearGradient id="rwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a3e"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#rsky)"/>
  <!-- sun -->
  <circle cx="220" cy="110" r="44" fill="#fff3c4" opacity="0.95"/>
  <!-- clouds with speed -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="600" cy="90" rx="100" ry="24"/><ellipse cx="900" cy="70" rx="80" ry="20"/>
  </g>

  <!-- FAR mountains -->
  <path d="M0,380 L0,220 L140,110 L280,230 L420,100 L560,240 L700,120 L840,240 L980,110 L1120,230 L1280,140 L1280,380 Z" fill="url(#rmtfar)"/>
  <g fill="#f4faff">
    <polygon points="140,110 118,140 162,140"/><polygon points="420,100 398,130 442,130"/>
    <polygon points="700,120 678,150 722,150"/><polygon points="980,110 958,140 1002,140"/>
  </g>
  <!-- MID mountains -->
  <path d="M0,430 L0,300 L200,180 L380,320 L580,190 L760,330 L960,200 L1140,320 L1280,240 L1280,430 Z" fill="url(#rmtmid)"/>
  <g fill="#eef4fb">
    <polygon points="200,180 178,210 222,210"/><polygon points="580,190 558,220 602,220"/><polygon points="960,200 938,230 982,230"/>
  </g>

  <!-- MIDGROUND pine band -->
  <g opacity="0.95">
    <g transform="translate(120,400) scale(0.9)">
      <rect x="-10" y="34" width="20" height="56" rx="8" fill="#6b4a2e"/>
      <polygon points="0,-76 -48,34 48,34" fill="#3d7a52"/><polygon points="0,-32 -58,66 58,66" fill="#356b46"/>
      <polygon points="0,-76 -19,-38 0,-46 19,-38" fill="#ffffff"/>
    </g>
    <g transform="translate(330,420) scale(1.1)">
      <rect x="-10" y="34" width="20" height="56" rx="8" fill="#6b4a2e"/>
      <polygon points="0,-76 -48,34 48,34" fill="#3d7a52"/><polygon points="0,-32 -58,66 58,66" fill="#356b46"/>
      <polygon points="0,-76 -19,-38 0,-46 19,-38" fill="#ffffff"/>
      <polygon points="-30,12 0,-1 30,12 21,25 -21,25" fill="#ffffff" opacity="0.92"/>
    </g>
    <g transform="translate(620,410) scale(0.85)">
      <rect x="-10" y="34" width="20" height="56" rx="8" fill="#6b4a2e"/>
      <polygon points="0,-76 -48,34 48,34" fill="#3d7a52"/><polygon points="0,-32 -58,66 58,66" fill="#356b46"/>
      <polygon points="0,-76 -19,-38 0,-46 19,-38" fill="#ffffff"/>
    </g>
    <g transform="translate(900,405) scale(1.0)">
      <rect x="-10" y="34" width="20" height="56" rx="8" fill="#6b4a2e"/>
      <polygon points="0,-76 -48,34 48,34" fill="#3d7a52"/><polygon points="0,-32 -58,66 58,66" fill="#356b46"/>
      <polygon points="0,-76 -19,-38 0,-46 19,-38" fill="#ffffff"/>
      <polygon points="-30,12 0,-1 30,12 21,25 -21,25" fill="#ffffff" opacity="0.92"/>
    </g>
    <g transform="translate(1150,415) scale(0.9)">
      <rect x="-10" y="34" width="20" height="56" rx="8" fill="#6b4a2e"/>
      <polygon points="0,-76 -48,34 48,34" fill="#3d7a52"/><polygon points="0,-32 -58,66 58,66" fill="#356b46"/>
      <polygon points="0,-76 -19,-38 0,-46 19,-38" fill="#ffffff"/>
    </g>
  </g>

  <!-- TRACK -->
  <path d="M0,470 Q640,440 1280,470 L1280,720 L0,720 Z" fill="url(#rtrack)"/>
  <g stroke="#c9dff2" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M0,560 Q320,548 640,558 Q960,568 1280,556"/>
    <path d="M0,610 Q320,598 640,608 Q960,618 1280,606"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M80,585 Q200,578 320,585 M700,590 Q820,583 940,590"/>
  </g>

  <!-- SPEED LINES -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.9">
    <path d="M60,480 L220,480" stroke-width="10"/>
    <path d="M20,520 L160,520" stroke-width="7"/>
    <path d="M900,470 L1080,470" stroke-width="10"/>
    <path d="M960,510 L1120,510" stroke-width="7"/>
    <path d="M1050,440 L1200,440" stroke-width="8"/>
  </g>

  <!-- HUSKY SLED (ahead, right) -->
  <g transform="translate(830,430)">
    <ellipse cx="90" cy="150" rx="130" ry="14" fill="#a9c8e6" opacity="0.5"/>
    <!-- snow spray behind -->
    <g fill="#ffffff">
      <circle cx="-40" cy="120" r="20" opacity="0.9"/><circle cx="-80" cy="100" r="14" opacity="0.75"/>
      <circle cx="-110" cy="125" r="10" opacity="0.6"/><circle cx="-60" cy="140" r="12" opacity="0.8"/>
    </g>
    <g fill="#e8f3fd">
      <circle cx="-60" cy="110" r="8" opacity="0.8"/><circle cx="-95" cy="135" r="6" opacity="0.7"/>
    </g>
    <!-- sled -->
    <g>
      <path d="M-20,120 Q-20,142 10,142 M200,120 Q200,142 170,142" stroke="#5f3d22" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="-20" y="108" width="220" height="14" rx="7" fill="#5f3d22"/>
      <g fill="url(#rwood)">
        <rect x="-10" y="76" width="30" height="36" rx="7"/><rect x="44" y="72" width="30" height="40" rx="7"/>
        <rect x="78" y="72" width="30" height="40" rx="7"/><rect x="112" y="72" width="30" height="40" rx="7"/>
        <rect x="146" y="76" width="30" height="36" rx="7"/>
      </g>
      <rect x="176" y="40" width="16" height="72" rx="8" fill="url(#rwood)" transform="rotate(10 176 40)"/>
    </g>
    <!-- husky musher: sitting upright, leaning into the race -->
    <g>
      <!-- curled tail over back -->
      <path d="M52,60 Q30,40 44,22 Q58,34 60,52 Z" fill="#8d9aa8"/>
      <path d="M52,60 Q36,44 46,30" stroke="#eef2f6" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- body (upright, sitting) -->
      <ellipse cx="100" cy="62" rx="50" ry="50" fill="#8d9aa8"/>
      <path d="M58,44 Q95,26 135,42 Q105,36 80,44 Q66,48 58,44 Z" fill="#7a8794" opacity="0.6"/>
      <ellipse cx="112" cy="78" rx="34" ry="30" fill="#eef2f6"/>
      <!-- haunches -->
      <ellipse cx="68" cy="96" rx="24" ry="20" fill="#8d9aa8"/>
      <ellipse cx="138" cy="96" rx="24" ry="20" fill="#8d9aa8"/>
      <!-- head -->
      <circle cx="152" cy="26" r="37" fill="#8d9aa8"/>
      <path d="M152,-2 Q136,12 134,30 Q132,50 152,60 Q172,50 170,30 Q168,12 152,-2 Z" fill="#eef2f6"/>
      <!-- ears -->
      <path d="M128,2 Q124,-22 140,-24 Q150,-14 146,2 Z" fill="#8d9aa8"/>
      <path d="M168,0 Q174,-24 188,-22 Q188,-6 178,4 Z" fill="#8d9aa8"/>
      <path d="M132,-4 Q130,-16 139,-17 Q145,-10 142,0 Z" fill="#f2b8c6"/>
      <!-- blue eyes -->
      <ellipse cx="143" cy="26" rx="7" ry="9" fill="#3a2c22"/>
      <ellipse cx="162" cy="26" rx="7" ry="9" fill="#3a2c22"/>
      <circle cx="143" cy="26" rx="3.5" fill="#4c8de2"/><circle cx="162" cy="26" rx="3.5" fill="#4c8de2"/>
      <circle cx="144" cy="25" r="1.5" fill="#ffffff"/><circle cx="163" cy="25" r="1.5" fill="#ffffff"/>
      <!-- nose + grin -->
      <ellipse cx="152" cy="42" rx="8" ry="6" fill="#3a2c22"/>
      <path d="M152,48 Q144,56 136,54 M152,48 Q160,56 168,54" stroke="#3a2c22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- musher scarf flying behind -->
      <path d="M112,54 Q60,42 10,60 L16,80 Q66,64 114,72 Z" fill="#e2574c"/>
      <path d="M10,60 Q-12,66 -20,84 Q-2,80 16,80 Z" fill="#c2453d"/>
    </g>
  </g>

  <!-- KIKI'S SLED (chasing, left) -->
  <g transform="translate(330,450)">
    <ellipse cx="110" cy="150" rx="140" ry="14" fill="#a9c8e6" opacity="0.5"/>
    <!-- snow spray behind -->
    <g fill="#ffffff">
      <circle cx="-50" cy="120" r="24" opacity="0.9"/><circle cx="-95" cy="100" r="16" opacity="0.75"/>
      <circle cx="-130" cy="125" r="11" opacity="0.6"/><circle cx="-70" cy="142" r="14" opacity="0.8"/>
    </g>
    <g fill="#e8f3fd">
      <circle cx="-72" cy="110" r="9" opacity="0.8"/><circle cx="-110" cy="138" r="7" opacity="0.7"/>
    </g>
    <!-- sled -->
    <g>
      <path d="M-20,120 Q-20,142 10,142 M220,120 Q220,142 190,142" stroke="#5f3d22" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="-20" y="108" width="240" height="14" rx="7" fill="#5f3d22"/>
      <g fill="url(#rwood)">
        <rect x="-10" y="76" width="30" height="36" rx="7"/><rect x="44" y="72" width="30" height="40" rx="7"/>
        <rect x="78" y="72" width="30" height="40" rx="7"/><rect x="112" y="72" width="30" height="40" rx="7"/>
        <rect x="146" y="72" width="30" height="40" rx="7"/><rect x="180" y="76" width="30" height="36" rx="7"/>
      </g>
      <rect x="196" y="40" width="16" height="72" rx="8" fill="url(#rwood)" transform="rotate(10 196 40)"/>
    </g>
    <!-- Kiki riding: sitting, leaning forward, scarf flying -->
    <g>
      <!-- body (sitting) -->
      <ellipse cx="105" cy="60" rx="58" ry="52" fill="#e8963f"/>
      <path d="M55,40 Q100,20 150,38 Q115,32 85,42 Q68,48 55,40 Z" fill="#c97a28" opacity="0.55"/>
      <ellipse cx="118" cy="76" rx="40" ry="34" fill="#fff6ea"/>
      <!-- haunches -->
      <ellipse cx="70" cy="95" rx="26" ry="22" fill="#e8963f"/>
      <ellipse cx="150" cy="95" rx="26" ry="22" fill="#e8963f"/>
      <!-- tail -->
      <circle cx="48" cy="60" r="14" fill="#fff6ea"/>
      <!-- head (leaning forward) -->
      <circle cx="168" cy="18" r="44" fill="#e8963f"/>
      <path d="M140,-8 Q134,-40 152,-44 Q166,-34 162,-10 Z" fill="#e8963f"/>
      <path d="M146,-16 Q143,-34 153,-35 Q160,-28 157,-14 Z" fill="#f2a0a0"/>
      <path d="M192,-12 Q200,-42 216,-40 Q218,-22 206,-6 Z" fill="#e8963f"/>
      <path d="M198,-18 Q204,-34 212,-33 Q213,-20 206,-10 Z" fill="#f2a0a0"/>
      <path d="M168,-16 Q150,0 148,20 Q146,42 168,52 Q190,42 188,20 Q186,0 168,-16 Z" fill="#fff6ea"/>
      <!-- determined eyes (looking ahead) -->
      <ellipse cx="158" cy="16" rx="8" ry="10" fill="#3a2c22"/>
      <ellipse cx="180" cy="16" rx="8" ry="10" fill="#3a2c22"/>
      <circle cx="160" cy="13" r="3" fill="#ffffff"/>
      <circle cx="182" cy="13" r="3" fill="#ffffff"/>
      <!-- focused brows -->
      <path d="M148,2 L166,6 M190,6 L174,2" stroke="#8a5a28" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="168" cy="34" rx="9" ry="7" fill="#3a2c22"/>
      <path d="M168,41 Q160,48 152,46 M168,41 Q176,48 184,46" stroke="#3a2c22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- flying scarf -->
      <path d="M120,52 Q70,40 20,58 L26,78 Q76,62 122,70 Z" fill="#4c8de2"/>
      <path d="M20,58 Q0,64 -8,80 Q8,78 26,78 Z" fill="#3d6fb3"/>
    </g>
  </g>

  <!-- FOREGROUND speed streaks -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="0" y="640" width="180" height="14" rx="7"/>
    <rect x="1050" y="660" width="230" height="16" rx="8"/>
    <rect x="400" y="690" width="150" height="12" rx="6" opacity="0.7"/>
  </g>
  <!-- foreground pine boughs -->
  <g transform="translate(1230,120)">
    <path d="M0,0 Q-60,40 -140,44" stroke="#2f5f40" stroke-width="16" fill="none" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="-60" cy="30" rx="34" ry="12" transform="rotate(-8 -60 30)"/>
    </g>
  </g>

  <!-- RACE UI: Steady / Turbo as integrated choice banners -->
  <g id="race-ui">
    <g transform="translate(470,655)">
      <rect x="-150" y="-44" width="300" height="88" rx="24" fill="#2f6bb3" stroke="#ffffff" stroke-width="5"/>
      <text x="0" y="-6" text-anchor="middle" font-family="Arial Black, Arial" font-size="30" fill="#ffffff">🐾 STEADY</text>
      <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#bfe0f7">Safe and sure</text>
    </g>
    <g transform="translate(810,655)">
      <rect x="-150" y="-44" width="300" height="88" rx="24" fill="#e2574c" stroke="#ffffff" stroke-width="5"/>
      <text x="0" y="-6" text-anchor="middle" font-family="Arial Black, Arial" font-size="30" fill="#ffffff">⚡ TURBO</text>
      <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffd9d4">Risky and fast!</text>
    </g>
    <!-- turn banner -->
    <g transform="translate(640,120)">
      <rect x="-190" y="-36" width="380" height="72" rx="22" fill="#17324d" opacity="0.88"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Arial Black, Arial" font-size="26" fill="#ffd24d">YOUR TURN, MUSHER!</text>
      <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#bfe0f7">Kiki is gaining — choose her pace</text>
    </g>
  </g>
  <!-- progress: checkered flag ahead -->
  <g transform="translate(1150,300)">
    <rect x="-5" y="-80" width="10" height="110" fill="#5f3d22"/>
    <g transform="rotate(6 0 -60)">
      <rect x="5" y="-100" width="64" height="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <rect x="5" y="-100" width="16" height="13" fill="#222"/><rect x="37" y="-100" width="16" height="13" fill="#222"/>
      <rect x="21" y="-87" width="16" height="13" fill="#222"/><rect x="53" y="-87" width="16" height="13" fill="#222"/>
      <rect x="5" y="-74" width="16" height="14" fill="#222"/><rect x="37" y="-74" width="16" height="14" fill="#222"/>
    </g>
  </g>
</svg>
