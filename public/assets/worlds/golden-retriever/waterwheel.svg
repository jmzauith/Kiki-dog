<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="www" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5713f"/>
      <stop offset="1" stop-color="#6b4423"/>
    </linearGradient>
  </defs>
  <!-- frame -->
  <rect x="96" y="20" width="28" height="200" rx="10" fill="url(#www)"/>
  <polygon points="60,220 160,220 140,180 80,180" fill="#8a8f96"/>
  <!-- wheel -->
  <g>
    <circle cx="110" cy="110" r="78" fill="none" stroke="url(#www)" stroke-width="16"/>
    <g stroke="url(#www)" stroke-width="12">
      <path d="M110,32 L110,188 M32,110 L188,110 M55,55 L165,165 M165,55 L55,165"/>
    </g>
    <g fill="#c08a4d" stroke="#6b4423" stroke-width="3">
      <rect x="96" y="18" width="28" height="26" rx="6"/>
      <rect x="96" y="176" width="28" height="26" rx="6"/>
      <rect x="18" y="96" width="28" height="26" rx="6"/>
      <rect x="176" y="96" width="28" height="26" rx="6"/>
    </g>
    <circle cx="110" cy="110" r="16" fill="#6b4423"/>
  </g>
  <!-- motion arcs (still-state: faint; integrator can rotate the wheel group) -->
  <g stroke="#4fc3d9" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M30,60 Q50,40 80,34"/>
    <path d="M140,186 Q170,180 190,160"/>
  </g>
  <!-- water splash at base -->
  <g fill="#a8e6f2" opacity="0.8">
    <circle cx="70" cy="215" r="7"/><circle cx="150" cy="218" r="6"/><circle cx="110" cy="225" r="8"/>
  </g>
</svg>
