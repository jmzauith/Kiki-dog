<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <!-- ground snow -->
  <ellipse cx="75" cy="136" rx="52" ry="11" fill="#ffffff" opacity="0.95"/>
  <!-- post -->
  <rect x="69" y="42" width="12" height="96" rx="5" fill="#8d5a32" stroke="#63371c" stroke-width="2.5"/>
  <ellipse cx="75" cy="42" rx="11" ry="6" fill="#ffffff"/>
  <!-- left sign: safe winding trail -->
  <g transform="rotate(-7 40 66)">
    <polygon points="8,56 58,56 70,66 58,76 8,76" fill="#b97940" stroke="#63371c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M20,66 C28,60 34,72 44,66" fill="none" stroke="#fff3d9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- right sign: icy shortcut -->
  <g transform="rotate(7 110 96)">
    <polygon points="142,86 92,86 80,96 92,106 142,106" fill="#9fd4f5" stroke="#3f7ca8" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <line x1="111" y1="89" x2="111" y2="103"/>
      <line x1="105" y1="92" x2="117" y2="100"/>
      <line x1="117" y1="92" x2="105" y2="100"/>
    </g>
  </g>
  <!-- small lantern on top -->
  <rect x="66" y="18" width="18" height="20" rx="4" fill="#3a4a5a" stroke="#22303d" stroke-width="2"/>
  <rect x="70" y="22" width="10" height="12" rx="2" fill="#ffd97a"/>
  <polygon points="66,18 84,18 75,8" fill="#3a4a5a" stroke="#22303d" stroke-width="2" stroke-linejoin="round"/>
</svg>
