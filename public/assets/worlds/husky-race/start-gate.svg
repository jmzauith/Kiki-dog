  <polygon points="130,108 142,112 132,122" fill="#e2574c"/>
  <polygon points="168,114 180,116 171,126" fill="#4c8de2"/>
  <polygon points="206,116 218,116 209,126" fill="#ffd24d"/>
  <polygon points="244,114 256,112 247,122" fill="#58b368"/>
  <polygon points="282,108 294,104 285,114" fill="#e2574c"/>
  <!-- side pennants -->
  <polygon points="49,110 49,150 78,130" fill="#e2574c"/>
  <polygon points="371,110 371,150 342,130" fill="#4c8de2"/>
  <circle cx="120" cy="200" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="310" cy="216" r="6" fill="#ffffff" opacity="0.8"/>
