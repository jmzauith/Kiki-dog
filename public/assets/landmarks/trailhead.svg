<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150">
  <!-- ground snow -->
  <ellipse cx="80" cy="136" rx="66" ry="12" fill="#ffffff" opacity="0.95"/>
  <!-- posts -->
  <rect x="28" y="52" width="15" height="82" rx="5" fill="#8d5a32" stroke="#63371c" stroke-width="2.5"/>
  <rect x="117" y="52" width="15" height="82" rx="5" fill="#8d5a32" stroke="#63371c" stroke-width="2.5"/>
  <!-- snow caps on posts -->
  <ellipse cx="35" cy="52" rx="12" ry="6" fill="#ffffff"/>
  <ellipse cx="124" cy="52" rx="12" ry="6" fill="#ffffff"/>
  <!-- top beam -->
  <rect x="20" y="34" width="120" height="18" rx="9" fill="#a06a3c" stroke="#63371c" stroke-width="2.5"/>
  <ellipse cx="80" cy="36" rx="58" ry="7" fill="#ffffff" opacity="0.9"/>
  <!-- hanging sign -->
  <line x1="58" y1="52" x2="58" y2="66" stroke="#4a2f18" stroke-width="3"/>
  <line x1="102" y1="52" x2="102" y2="66" stroke="#4a2f18" stroke-width="3"/>
  <rect x="42" y="66" width="76" height="44" rx="8" fill="#b97940" stroke="#63371c" stroke-width="3"/>
  <!-- paw print -->
  <ellipse cx="62" cy="94" rx="7" ry="6" fill="#5a3a1e"/>
  <circle cx="54" cy="86" r="3" fill="#5a3a1e"/>
  <circle cx="61" cy="83" r="3" fill="#5a3a1e"/>
  <circle cx="68" cy="86" r="3" fill="#5a3a1e"/>
  <!-- sign text -->
  <text x="94" y="92" font-family="Arial Black, Arial" font-size="12" fill="#fff6e3" text-anchor="middle">TRAIL</text>
  <text x="94" y="105" font-family="Arial Black, Arial" font-size="12" fill="#fff6e3" text-anchor="middle">HEAD</text>
</svg>
