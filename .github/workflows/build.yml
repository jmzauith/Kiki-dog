name: Build and Husky quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and gameplay regression tests
        run: npm run test
      - name: Validate painted SVG art
        run: npm run validate:art
      - name: Typecheck and production build
        run: npm run build
