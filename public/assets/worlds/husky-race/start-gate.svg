  </defs>
  <ellipse cx="210" cy="244" rx="180" ry="14" fill="#a9c8e6" opacity="0.55"/>
  <!-- posts -->
  <rect x="36" y="60" width="26" height="180" rx="10" fill="url(#sgw)"/>
  <rect x="358" y="60" width="26" height="180" rx="10" fill="url(#sgw)"/>
  <rect x="30" y="50" width="38" height="18" rx="9" fill="url(#sgs)"/>
  <rect x="352" y="50" width="38" height="18" rx="9" fill="url(#sgs)"/>
