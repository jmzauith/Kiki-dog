<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260">
  <defs>
    <linearGradient id="bhw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a3e"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
    <linearGradient id="bhr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a48"/>
      <stop offset="1" stop-color="#5f3d30"/>
    </linearGradient>
  </defs>
  <ellipse cx="170" cy="246" rx="150" ry="12" fill="#7ab648" opacity="0.4"/>
  <!-- boathouse on stilts over water -->
  <rect x="60" y="80" width="220" height="130" rx="10" fill="url(#bhw)" stroke="#5f3d22" stroke-width="4"/>
  <g stroke="#5f3d22" stroke-width="3" opacity="0.5">
    <path d="M60,110 L280,110 M60,140 L280,140 M60,170 L280,170"/>
  </g>
  <!-- roof -->
  <polygon points="40,90 170,20 300,90" fill="url(#bhr)" stroke="#4a2e20" stroke-width="4"/>
  <polygon points="40,90 170,20 300,90 L286,90 L170,32 L54,90 Z" fill="#a5715a" opacity="0.5"/>
  <!-- closed double doors with porthole -->
  <rect x="120" y="130" width="100" height="80" rx="8" fill="#5f3d22" stroke="#3a2418" stroke-width="4"/>
  <path d="M170,130 L170,210" stroke="#3a2418" stroke-width="5"/>
  <circle cx="170" cy="112" r="16" fill="#4fc3d9" stroke="#e8fbff" stroke-width="5"/>
  <rect x="154" y="160" width="32" height="10" rx="5" fill="#c9a06a"/>
  <!-- stilts + water -->
  <g fill="#6b4423">
    <rect x="80" y="210" width="18" height="40" rx="6"/>
    <rect x="242" y="210" width="18" height="40" rx="6"/>
  </g>
  <ellipse cx="170" cy="250" rx="140" ry="12" fill="#4fc3d9" opacity="0.6"/>
  <!-- locked cue -->
  <circle cx="170" cy="182" r="14" fill="#c9a06a" stroke="#8a5a30" stroke-width="3"/>
  <circle cx="170" cy="182" r="5" fill="#4e3319"/>
</svg>
