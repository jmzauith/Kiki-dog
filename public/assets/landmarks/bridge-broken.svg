<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130">
  <!-- chasm -->
  <path d="M55,78 L75,118 L105,118 L125,78 Z" fill="#33506e"/>
  <path d="M68,84 L78,112 L88,112 L84,84 Z" fill="#4a7ba6" opacity="0.7"/>
  <path d="M96,84 L92,112 L102,112 L110,84 Z" fill="#4a7ba6" opacity="0.5"/>
  <!-- snow banks at edges -->
  <ellipse cx="40" cy="80" rx="42" ry="12" fill="#ffffff"/>
  <ellipse cx="140" cy="80" rx="42" ry="12" fill="#ffffff"/>
  <!-- left deck planks -->
  <rect x="4" y="62" width="52" height="11" rx="3" fill="#b97940" stroke="#63371c" stroke-width="2"/>
  <rect x="4" y="58" width="52" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <!-- right deck, tilted and broken -->
  <g transform="rotate(9 140 67)">
    <rect x="114" y="62" width="52" height="11" rx="3" fill="#b97940" stroke="#63371c" stroke-width="2"/>
    <rect x="114" y="58" width="52" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  </g>
  <!-- dangling broken plank -->
  <g transform="rotate(64 70 67)">
    <rect x="64" y="62" width="34" height="10" rx="3" fill="#a06a3c" stroke="#63371c" stroke-width="2"/>
  </g>
  <!-- dangling rope -->
  <path d="M96,64 C100,78 96,92 104,104" fill="none" stroke="#7a5a36" stroke-width="3" stroke-linecap="round"/>
  <!-- posts -->
  <rect x="10" y="40" width="9" height="42" rx="3" fill="#8d5a32" stroke="#63371c" stroke-width="2"/>
  <rect x="161" y="44" width="9" height="42" rx="3" fill="#8d5a32" stroke="#63371c" stroke-width="2"/>
  <!-- sagging rope rails -->
  <path d="M14,46 C60,66 120,66 165,50" fill="none" stroke="#7a5a36" stroke-width="3"/>
  <!-- warning sparkles -->
  <path d="M90,30 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z" fill="#ffd24d" opacity="0.95"/>
  <circle cx="118" cy="26" r="3" fill="#ffd24d" opacity="0.8"/>
</svg>
