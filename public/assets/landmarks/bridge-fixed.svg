<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130">
  <!-- chasm -->
  <path d="M55,78 L75,118 L105,118 L125,78 Z" fill="#33506e"/>
  <path d="M68,84 L78,112 L88,112 L84,84 Z" fill="#4a7ba6" opacity="0.7"/>
  <path d="M96,84 L92,112 L102,112 L110,84 Z" fill="#4a7ba6" opacity="0.5"/>
  <!-- snow banks at edges -->
  <ellipse cx="40" cy="80" rx="42" ry="12" fill="#ffffff"/>
  <ellipse cx="140" cy="80" rx="42" ry="12" fill="#ffffff"/>
  <!-- full deck: fresh planks -->
  <g>
    <rect x="4" y="62" width="28" height="11" rx="3" fill="#c98d4e" stroke="#63371c" stroke-width="2"/>
    <rect x="34" y="62" width="28" height="11" rx="3" fill="#c98d4e" stroke="#63371c" stroke-width="2"/>
    <rect x="64" y="62" width="28" height="11" rx="3" fill="#dba45f" stroke="#63371c" stroke-width="2"/>
    <rect x="94" y="62" width="28" height="11" rx="3" fill="#c98d4e" stroke="#63371c" stroke-width="2"/>
    <rect x="124" y="62" width="28" height="11" rx="3" fill="#c98d4e" stroke="#63371c" stroke-width="2"/>
    <rect x="154" y="62" width="22" height="11" rx="3" fill="#c98d4e" stroke="#63371c" stroke-width="2"/>
  </g>
  <!-- snow dusting on fresh planks -->
  <rect x="60" y="58" width="36" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="100" y="58" width="30" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <!-- posts -->
  <rect x="10" y="40" width="9" height="42" rx="3" fill="#8d5a32" stroke="#63371c" stroke-width="2"/>
  <rect x="161" y="40" width="9" height="42" rx="3" fill="#8d5a32" stroke="#63371c" stroke-width="2"/>
  <!-- taut rope rails -->
  <path d="M14,44 C60,52 120,52 165,44" fill="none" stroke="#7a5a36" stroke-width="3"/>
  <!-- celebration sparkles -->
  <path d="M90,26 l3.5,8 8,3.5 -8,3.5 -3.5,8 -3.5,-8 -8,-3.5 8,-3.5 Z" fill="#ffd24d"/>
  <circle cx="60" cy="30" r="3.5" fill="#fff3b0"/>
  <circle cx="122" cy="30" r="3.5" fill="#fff3b0"/>
  <circle cx="90" cy="12" r="2.5" fill="#ffffff"/>
