<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <linearGradient id="cve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc8ec"/>
      <stop offset="1" stop-color="#5d93c9"/>
    </linearGradient>
    <radialGradient id="cvd" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#0e2238"/>
      <stop offset="1" stop-color="#274b6e"/>
    </radialGradient>
    <linearGradient id="cvs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8ecfd"/>
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="244" rx="160" ry="12" fill="#a9c8e6" opacity="0.5"/>
  <!-- ice cliff -->
  <path d="M20,244 L40,60 Q90,20 140,44 Q180,10 230,36 Q290,16 330,60 L340,244 Z" fill="url(#cve)"/>
  <!-- mouth -->
  <path d="M110,244 L118,140 Q150,100 190,104 Q230,108 244,150 L252,244 Z" fill="url(#cvd)"/>
  <path d="M118,140 Q150,100 190,104 Q230,108 244,150" stroke="url(#cvs)" stroke-width="10" fill="none" opacity="0.9"/>
  <!-- icicles -->
  <g fill="url(#cvs)">
    <polygon points="140,116 148,116 144,150"/>
    <polygon points="168,108 177,108 172,146"/>
    <polygon points="196,108 205,108 200,140"/>
    <polygon points="220,116 228,116 224,144"/>
  </g>
  <!-- snow cap -->
  <path d="M40,60 Q90,20 140,44 Q180,10 230,36 Q290,16 330,60 Q290,44 240,58 Q190,40 140,60 Q90,44 40,60 Z" fill="url(#cvs)"/>
  <!-- faint inner glow (challenge beckons) -->
  <ellipse cx="185" cy="190" rx="42" ry="52" fill="#4c8de2" opacity="0.28"/>
  <polygon points="185,168 188,178 198,179 190,185 193,195 185,189 177,195 180,185 172,179 182,178" fill="#ffd24d" opacity="0.9"/>
</svg>
