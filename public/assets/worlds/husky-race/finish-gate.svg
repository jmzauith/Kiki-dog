<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260">
  <defs>
    <linearGradient id="fgp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2b"/>
