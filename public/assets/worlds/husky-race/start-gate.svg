<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260">
  <defs>
    <linearGradient id="sgw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4f2a"/>
      <stop offset="0.5" stop-color="#9c6a3a"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
    <linearGradient id="sgs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ecfc"/>
    </linearGradient>
    <linearGradient id="sgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58b368"/>
      <stop offset="1" stop-color="#3d8a4e"/>
