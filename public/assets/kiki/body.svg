  <!-- backpack -->
  <rect x="50" y="22" width="32" height="28" rx="7" fill="#315c9a" stroke="#1d365e" stroke-width="2.5"/>
  <rect x="57" y="30" width="18" height="13" rx="4" fill="#4a7ec2"/>
  <rect x="54" y="22" width="6" height="28" fill="#274a7c" opacity="0.55"/>
  <rect x="72" y="22" width="6" height="28" fill="#274a7c" opacity="0.55"/>
