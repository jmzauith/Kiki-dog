      <rect x="126" y="12" width="13" height="11" fill="#222"/><rect x="152" y="12" width="13" height="11" fill="#222"/>
      <rect x="139" y="23" width="13" height="12" fill="#222"/><rect x="165" y="23" width="13" height="12" fill="#222"/>
