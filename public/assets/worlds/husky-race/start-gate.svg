  <polygon points="358,90 384,90 378,150 364,150" fill="#4e3319" opacity="0.4"/>
  <!-- crossbeam -->
  <rect x="36" y="66" width="348" height="26" rx="10" fill="url(#sgw)"/>
  <rect x="36" y="62" width="348" height="10" rx="5" fill="url(#sgs)" opacity="0.95"/>
  <!-- START banner -->
